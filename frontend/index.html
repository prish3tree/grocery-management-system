<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Grocery Management System</h1>
        <p>Manage your grocery store from one place.</p>
    </header>

    <main>

        <section class="dashboard">
            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <h3>Products</h3>
                    <p>Manage grocery products and prices.</p>
                    <button>View Products</button>
                </div>

                <div class="card">
                    <h3>Inventory</h3>
                    <p>Track available stock and inventory.</p>
                    <button>View Inventory</button>
                </div>

                <div class="card">
                    <h3>Customers</h3>
                    <p>Manage customer information.</p>
                    <button>View Customers</button>
                </div>

                <div class="card">
                    <h3>Orders</h3>
                    <p>Create and manage customer orders.</p>
                    <button>View Orders</button>
                </div>

            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
